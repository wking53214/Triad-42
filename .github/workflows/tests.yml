name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ".[ccc]"
      - name: Test (CCC handoff tests may not skip)
        env:
          TRIAD42_REQUIRE_CCC: "1"
        run: python -m pytest -q -rs
      - name: Examples
        run: |
          python example_pass.py
          python example_cross_cutting.py
