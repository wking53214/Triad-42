[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triad42"
version = "3.0.0"
description = "An advisory cognitive review harness: Red, Gray, Green, and 42"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# CCC owns origin, promotion and erasure rules; needed only for ccc_handoff.
ccc = ["cognitive-continuity-constitution @ git+https://github.com/wking53214/CCC@96cfc9c5908d68df6fa56907b09ca26363c57087"]
# Optional: lets one review output be named for a CNS verdict (triad42.cns_connector). Nothing in Triad+42 imports CNS otherwise.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v1.9.0"]

[tool.setuptools.packages.find]
include = ["triad42*"]
