[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triad42"
version = "3.0.0"
description = "An advisory cognitive review harness: Red, Gray, Green, and 42"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William King" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# CCC owns origin, promotion and erasure rules; needed only for ccc_handoff.
ccc = ["cognitive-continuity-constitution @ git+https://github.com/wking53214/CCC@94835da0ffb975489b2dc54d3ca3eb4bf21fd15c"]

[tool.setuptools.packages.find]
include = ["triad42*"]
